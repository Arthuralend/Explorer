name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Explorer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Explorer-apk
          path: Explorer.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Explorer.apk \
            --title "Проводник — последняя сборка" \
            --notes "Автоматическая сборка из коммита ${GITHUB_SHA::7}. Скачайте Explorer.apk и установите на телефон." \
            --target "$GITHUB_SHA"
